// ============ AUDIO ENGINE (retro chiptune, no external files) ============
class RetroAudio {
  constructor(){
    this.ctx = null;
    this.enabled = true;
    this.musicOn = false;
    this.musicTimer = null;
    this.noteIndex = 0;
  }
  ensure(){
    if(!this.ctx){
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(this.ctx.state === 'suspended') this.ctx.resume();
  }
  beep(freq, duration, type='square', vol=0.15, delay=0){
    if(!this.enabled) return;
    this.ensure();
    const t0 = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration);
  }
  flap(){ this.beep(520, 0.08, 'square', 0.12); }
  score(){
    this.beep(880, 0.08, 'square', 0.15);
    this.beep(1174, 0.1, 'square', 0.15, 0.08);
  }
  hit(){
    this.beep(140, 0.25, 'sawtooth', 0.2);
    this.beep(90, 0.35, 'sawtooth', 0.18, 0.05);
  }
  gameOverJingle(){
    const notes = [392, 349, 294, 220];
    notes.forEach((n,i)=> this.beep(n, 0.22, 'triangle', 0.16, i*0.15));
  }
  startMusic(){
    if(this.musicOn) return;
    this.musicOn = true;
    // Simple retro 8-bit looping melody (bassline + lead alternating)
    const melody = [523,523,659,523,784,740,0, 523,523,659,523,880,784,0, 523,523,1046,880,784,740,659, 932,932,880,784,880,0,0];
    const bass   = [131,131,131,131,196,196,0, 131,131,131,131,175,175,0, 131,131,131,131,196,196,175, 147,147,147,147,196,0,0];
    let step = 0;
    const playStep = () => {
      if(!this.musicOn) return;
      const i = step % melody.length;
      if(melody[i] > 0) this.beep(melody[i], 0.14, 'square', 0.06);
      if(bass[i] > 0) this.beep(bass[i], 0.14, 'triangle', 0.07);
      step++;
      this.musicTimer = setTimeout(playStep, 150);
    };
    playStep();
  }
  stopMusic(){
    this.musicOn = false;
    if(this.musicTimer) clearTimeout(this.musicTimer);
  }
  toggle(){
    this.enabled = !this.enabled;
    if(!this.enabled) this.stopMusic();
    return this.enabled;
  }
}
const audio = new RetroAudio();

// ============ GAME ============
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const birdImg = new Image();
birdImg.src = BIRD_SRC;

const logoImg = new Image();
logoImg.src = LOGO_SRC;

const GRAVITY = 0.45;
const FLAP_VELOCITY = -7.6;
const PIPE_GAP = 155;
const PIPE_WIDTH = 62;
const PIPE_SPACING = 210;
const GROUND_H = 70;

let state = 'ready'; // ready, playing, over
let frame = 0;
let score = 0;
let best = parseInt(localStorage.getItem('meatstation_best') || '0', 10);

let bird = { x: 90, y: H/2, vy: 0, rot: 0, w: 42, h: 48 };
let pipes = [];
let particles = [];
let clouds = [];

function resetGame(){
  bird = { x: 90, y: H/2, vy: 0, rot: 0, w: 42, h: 48 };
  pipes = [];
  particles = [];
  score = 0;
  frame = 0;
  spawnPipe();
}

function spawnPipe(){
  const margin = 60;
  const gapY = margin + Math.random() * (H - GROUND_H - PIPE_GAP - margin*2) + PIPE_GAP/2;
  pipes.push({ x: W + 20, gapY: gapY, passed: false });
}

for(let i=0;i<5;i++){
  clouds.push({ x: Math.random()*W, y: 40 + Math.random()*150, s: 0.5+Math.random()*0.8, speed: 0.2+Math.random()*0.3 });
}

// Faint floating Meat Station logo watermarks in the sky (parallax background)
let bgLogos = [
  { x: W*0.22, y: 110, s: 0.9, speed: 0.12, rot: -6 },
  { x: W*0.72, y: 220, s: 0.6, speed: 0.08, rot: 8 }
];

function flap(){
  if(state === 'ready'){
    state = 'playing';
    audio.startMusic();
  }
  if(state === 'playing'){
    bird.vy = FLAP_VELOCITY;
    audio.flap();
    for(let i=0;i<4;i++){
      particles.push({x: bird.x - 5, y: bird.y + bird.h/2, vx: -1-Math.random()*1.5, vy: (Math.random()-0.5)*2, life: 20, r: 2+Math.random()*2});
    }
  }
  if(state === 'over'){
    resetGame();
    state = 'ready';
  }
}

document.addEventListener('keydown', (e)=>{
  if(e.code === 'Space'){ e.preventDefault(); flap(); }
});
canvas.addEventListener('mousedown', flap);
canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); flap(); }, {passive:false});

document.getElementById('soundBtn').addEventListener('click', ()=>{
  const on = audio.toggle();
  document.getElementById('soundBtn').textContent = on ? '🔊 SOUND: ON' : '🔇 SOUND: OFF';
  if(on && state === 'playing') audio.startMusic();
});

function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){
  return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}

function update(){
  frame++;

  clouds.forEach(c=>{
    c.x -= c.speed;
    if(c.x < -60) c.x = W + 60;
  });

  bgLogos.forEach(l=>{
    l.x -= l.speed;
    if(l.x < -90) l.x = W + 90;
  });

  if(state === 'playing'){
    bird.vy += GRAVITY;
    bird.y += bird.vy;
    bird.rot = Math.max(-25, Math.min(90, bird.vy * 4));

    if(frame % Math.floor(PIPE_SPACING/2.4) === 0){
      spawnPipe();
    }

    const PIPE_SPEED = 2.6;
    pipes.forEach(p => p.x -= PIPE_SPEED);
    pipes = pipes.filter(p => p.x > -PIPE_WIDTH - 10);

    pipes.forEach(p=>{
      if(!p.passed && p.x + PIPE_WIDTH < bird.x){
        p.passed = true;
        score++;
        audio.score();
      }
      const bx = bird.x - bird.w/2 + 6, by = bird.y - bird.h/2 + 6, bw = bird.w - 12, bh = bird.h - 12;
      const topH = p.gapY - PIPE_GAP/2;
      const botY = p.gapY + PIPE_GAP/2;
      if(rectsOverlap(bx,by,bw,bh, p.x, 0, PIPE_WIDTH, topH)) hitPipe();
      if(rectsOverlap(bx,by,bw,bh, p.x, botY, PIPE_WIDTH, H - GROUND_H - botY)) hitPipe();
    });

    if(bird.y + bird.h/2 > H - GROUND_H){
      bird.y = H - GROUND_H - bird.h/2;
      hitPipe();
    }
    if(bird.y - bird.h/2 < 0){
      bird.y = bird.h/2;
      bird.vy = 0;
    }
  }

  particles.forEach(pt=>{ pt.x += pt.vx; pt.y += pt.vy; pt.life--; });
  particles = particles.filter(pt => pt.life > 0);
}

function hitPipe(){
  if(state !== 'playing') return;
  state = 'over';
  audio.hit();
  audio.stopMusic();
  setTimeout(()=> audio.gameOverJingle(), 200);
  if(score > best){
    best = score;
    localStorage.setItem('meatstation_best', String(best));
  }
}

function drawBgLogo(l){
  if(!(logoImg.complete && logoImg.naturalWidth > 0)) return;
  const w = 90 * l.s, h = w * (logoImg.naturalHeight / logoImg.naturalWidth);
  ctx.save();
  ctx.globalAlpha = 0.16;
  ctx.translate(l.x, l.y);
  ctx.rotate(l.rot * Math.PI/180);
  ctx.drawImage(logoImg, -w/2, -h/2, w, h);
  ctx.restore();
}

function drawCloud(c){
  ctx.save();
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(c.x, c.y, 18*c.s, 0, Math.PI*2);
  ctx.arc(c.x+20*c.s, c.y+5*c.s, 14*c.s, 0, Math.PI*2);
  ctx.arc(c.x-20*c.s, c.y+5*c.s, 14*c.s, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawPipe(p){
  const topH = p.gapY - PIPE_GAP/2;
  const botY = p.gapY + PIPE_GAP/2;
  const grad = ctx.createLinearGradient(p.x, 0, p.x+PIPE_WIDTH, 0);
  grad.addColorStop(0, '#3fae4a');
  grad.addColorStop(0.5, '#5fd66c');
  grad.addColorStop(1, '#2e8a3a');

  ctx.fillStyle = grad;
  ctx.strokeStyle = '#1f5c28';
  ctx.lineWidth = 3;

  // top pipe
  ctx.fillRect(p.x, 0, PIPE_WIDTH, topH);
  ctx.strokeRect(p.x, 0, PIPE_WIDTH, topH);
  ctx.fillRect(p.x-4, topH-22, PIPE_WIDTH+8, 22);
  ctx.strokeRect(p.x-4, topH-22, PIPE_WIDTH+8, 22);

  // bottom pipe
  ctx.fillRect(p.x, botY, PIPE_WIDTH, H - GROUND_H - botY);
  ctx.strokeRect(p.x, botY, PIPE_WIDTH, H - GROUND_H - botY);
  ctx.fillRect(p.x-4, botY, PIPE_WIDTH+8, 22);
  ctx.strokeRect(p.x-4, botY, PIPE_WIDTH+8, 22);
}

function drawGround(){
  const gy = H - GROUND_H;
  const grad = ctx.createLinearGradient(0, gy, 0, H);
  grad.addColorStop(0, '#e0b45a');
  grad.addColorStop(1, '#c8943a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, gy, W, GROUND_H);
  ctx.fillStyle = '#8bc34a';
  ctx.fillRect(0, gy, W, 8);

  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 2;
  const offset = (frame * 2.6) % 30;
  for(let x = -30 + offset; x < W; x += 30){
    ctx.beginPath();
    ctx.moveTo(x, gy+8);
    ctx.lineTo(x-15, H);
    ctx.stroke();
  }
}

function drawBird(){
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rot * Math.PI/180);
  ctx.shadowColor = 'rgba(0,0,0,0.25)';
  ctx.shadowBlur = 6;
  ctx.shadowOffsetY = 3;
  if(birdImg.complete && birdImg.naturalWidth > 0){
    ctx.drawImage(birdImg, -bird.w/2, -bird.h/2, bird.w, bird.h);
  } else {
    ctx.fillStyle = '#ff2d2d';
    ctx.beginPath();
    ctx.arc(0,0,bird.w/2,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawParticles(){
  particles.forEach(pt=>{
    ctx.globalAlpha = pt.life/20;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

function drawText(text, x, y, size, color, align='center', strokeColor='#000'){
  ctx.font = `bold ${size}px 'Courier New', monospace`;
  ctx.textAlign = align;
  ctx.lineWidth = size/6;
  ctx.strokeStyle = strokeColor;
  ctx.fillStyle = color;
  ctx.strokeText(text, x, y);
  ctx.fillText(text, x, y);
}

function draw(){
  // sky gradient
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0, '#7ec8e3');
  sky.addColorStop(1, '#cdeffa');
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,H);

  bgLogos.forEach(drawBgLogo);
  clouds.forEach(drawCloud);
  pipes.forEach(drawPipe);
  drawGround();
  drawParticles();
  drawBird();

  // score
  if(state === 'playing'){
    drawText(String(score), W/2, 70, 48, '#ffffff');
  }

  if(state === 'ready'){
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0,0,W,H);
    drawText('MEAT STATION', W/2, H/2 - 60, 30, '#ff2d2d', 'center', '#fff');
    drawText('FLAPPY!', W/2, H/2 - 25, 30, '#ffd23f', 'center', '#fff');
    drawText('Tekan SPASI / Klik', W/2, H/2 + 30, 16, '#ffffff');
    drawText('untuk mulai', W/2, H/2 + 52, 16, '#ffffff');
    drawText('Best: ' + best, W/2, H/2 + 90, 16, '#ffd23f');
  }

  if(state === 'over'){
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0,0,W,H);
    drawText('GAME OVER', W/2, H/2 - 70, 34, '#ff2d2d', 'center', '#fff');
    drawText('Skor: ' + score, W/2, H/2 - 20, 24, '#ffffff');
    drawText('Terbaik: ' + best, W/2, H/2 + 15, 20, '#ffd23f');
    drawText('Klik / Spasi untuk ulang', W/2, H/2 + 60, 15, '#ffffff');
  }
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

resetGame();
loop();
</script>

</html>
